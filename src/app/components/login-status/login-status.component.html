<div class="login-status-header">

    <div *ngIf="isAuthenticated" class="login-status-user-info">
        Welcome back {{ userEmail }}!
    </div>

     <button *ngIf="!isAuthenticated" (click)="login()" class="security-btn">Login</button>

    <button *ngIf="isAuthenticated" (click)="logout()" class="security-btn">Logout</button>

    <button *ngIf="isAuthenticated" routerLink="/members" class="security-btn ml-1">Member</button>

    <button *ngIf="isAuthenticated" routerLink="/order-history" class="security-btn ms-1">Orders</button>
    <button *ngIf="isAdmin" routerLink="/admin/products" class="security-btn ms-1">Manage Produse</button>
    <button *ngIf="isAdmin" routerLink="/admin/stock-alerts" class="security-btn ms-1">Stoc</button>
    <button *ngIf="isAdmin"  routerLink="/admin/product-form" class="security-btn ms-1">Adauga Produs</button>
    <button *ngIf="isAdmin" routerLink="/search-orders-by-date" class="security-btn ml-1">
  Comenzi
</button>

    
</div>
