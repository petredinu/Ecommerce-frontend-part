<div class="detail-section">
    <div class="container-fluid">
        <!-- Loading state -->
        <div *ngIf="!product" class="text-center py-5">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Se încarcă...</span>
            </div>
            <p class="mt-3">Se încarcă detaliile produsului...</p>
        </div>

        <!-- Product details - shown only when product is loaded -->
        <div *ngIf="product">
            <div class="row">
                <div class="col-md-6">
                    <img src="{{product.imageUrl}}" 
                         alt="{{product.name}} - Detailed product image" 
                         title="{{product.name}}"
                         class="detail-img"
                         loading="lazy">
                </div>
                
                <div class="col-md-6">
                    <h3>{{product.name}}</h3>
                    <div class="price">{{ product.unitPrice | currency:'USD'}}</div>
                    
                    <div class="button-group mt-3">
                        <button (click)="addToCart()" class="btn btn-primary btn-sm">
                            <i class="fas fa-shopping-cart"></i> Add to cart
                        </button>
                        <button (click)="toggleWishlist()" 
                                class="btn btn-outline-danger btn-sm"
                                [class.btn-danger]="wishlistService.isInWishlist(product.id)">
                            <i class="fas fa-heart"></i> 
                            {{ wishlistService.isInWishlist(product.id) ? 'In Wishlist' : 'Add to Wishlist' }}
                        </button>
                    </div>

                    <hr>
                    <h4>Description</h4>
                    <p>{{product.description}}</p>

                    <a (click)="goBack()" class="mt-3 d-inline-block" style="cursor: pointer; color: blue; text-decoration: underline;">
                        <i class="fas fa-arrow-left"></i> Back to Product List
                    </a>
                </div>
            </div>

            <!-- Product Reviews Section -->
            <div class="row mt-5">
                <div class="col-12">
                    <app-product-reviews [productId]="product.id"></app-product-reviews>
                </div>
            </div>
        </div>
    </div>
</div>
