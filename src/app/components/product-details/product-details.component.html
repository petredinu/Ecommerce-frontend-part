<div class="detail-section">
    <div class="container-fluid">
        <!-- Loading state -->
        <div *ngIf="!product" class="text-center py-5">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Se încarcă...</span>
            </div>
            <p class="mt-3">Se încarcă detaliile produsului...</p>
        </div>

        <!-- Product details - shown only when product is loaded -->
        <div *ngIf="product">
            <img src="{{product.imageUrl}}" class="detail-img" alt="{{product.name}}">

            <h3>{{product.name}}</h3>
            <div class="price">{{ product.unitPrice | currency:'USD'}}</div>
            <button (click)="addToCart()" class="btn btn-primary btn-sm">Add to cart</button>

            <hr>
            <h4>Description</h4>
            <p>{{product.description}}</p>

            <a (click)="goBack()" class="mt-5" style="cursor: pointer; color: blue; text-decoration: underline;">Back to Product List</a>
        </div>
    </div>
</div>
