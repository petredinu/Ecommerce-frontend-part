<div class="cart-area">
    <a routerLink="/cart-details" class="btn btn-info btn-sm text-white">
        <span class="ml-1 font-weight-bold">{{ totalPrice | currency: 'USD' }}</span>
        <span class="badge badge-light ml-1">{{ totalQuantity }}</span>
         <i>
            <fa-icon [icon]="faCartShopping" aria-hidden="true" style="color: orangered;"></fa-icon>
         </i>
       
    </a>
</div>
