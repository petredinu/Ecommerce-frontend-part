<div class="menu-sidebar-content js-scrollbar1">
  <nav class="navbar-sidebar">
      <ul class="list-unstyled navbar-list">

          <!-- Admin Dashboard Button (visible doar pentru admin) -->
          <li *ngIf="isAdmin" class="admin-dashboard-item">
              <a routerLink="/admin/dashboard" routerLinkActive="active-link" class="admin-dashboard-link">
                  <i class="fas fa-chart-line"></i>
                  <span>Admin Dashboard</span>
              </a>
          </li>

          <li *ngIf="isAdmin" class="admin-menu-item">
              <a routerLink="/admin/promo-banners" routerLinkActive="active-link" class="admin-menu-link">
                  <i class="fas fa-bullhorn"></i>
                  <span>Bannere Promoționale</span>
              </a>
          </li>

          <li *ngIf="isAdmin" class="admin-menu-item">
              <a routerLink="/admin/promo-codes" routerLinkActive="active-link" class="admin-menu-link">
                  <i class="fas fa-tags"></i>
                  <span>Coduri Promoționale</span>
              </a>
          </li>

          <!-- Separator dacă e admin -->
          <li *ngIf="isAdmin" class="menu-separator"></li>

          <li *ngFor="let tempProductCategory of productCategories">

              <a routerLink="/category/{{ tempProductCategory.id }}" routerLinkActive="active-link">
                  {{ tempProductCategory.categoryName }}
              </a>
              
          </li>

      </ul>
     
</nav>
</div>
