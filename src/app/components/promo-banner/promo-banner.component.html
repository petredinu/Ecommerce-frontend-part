<div *ngIf="activeBanner && !isLoading" class="promo-banner-container" 
     [ngStyle]="{'background-color': activeBanner.backgroundColor || '#667eea'}">
  
  <div class="promo-banner-content">
    <!-- Text Section -->
    <div class="promo-text-section" [ngStyle]="{'color': activeBanner.textColor || '#ffffff'}">
      <h1 class="promo-title">{{ activeBanner.title }}</h1>
      <p class="promo-description">{{ activeBanner.description }}</p>
      <a *ngIf="activeBanner.linkUrl" 
         [routerLink]="activeBanner.linkUrl" 
         class="promo-button">
        {{ activeBanner.buttonText || 'Vezi Oferta' }}
      </a>
    </div>

    <!-- Image Section -->
    <div class="promo-image-section">
      <img [src]="activeBanner.imageUrl" 
           [alt]="activeBanner.title" 
           class="promo-image"
           (error)="onImageError($event)">
    </div>
  </div>
</div>

<!-- Loading State -->
<div *ngIf="isLoading" class="promo-banner-skeleton">
  <div class="skeleton-content">
    <div class="skeleton-text"></div>
    <div class="skeleton-text short"></div>
    <div class="skeleton-button"></div>
  </div>
  <div class="skeleton-image"></div>
</div>
