<div class="main-content">
  <div class="section-content section-content-p30">
    <div class="container-fluid">
      <h3>{{ isEditMode ? 'Editare Produs' : 'Adaugă Produs Nou' }}</h3>
      
      <form (ngSubmit)="onSubmit()" #productForm="ngForm">

        <div class="form-group">
          <label>SKU (Caută automat la introducere)</label>
          <input type="text" 
                 class="form-control" 
                 [(ngModel)]="product.sku"  
                 name="sku" 
                 required 
                 >
        </div>

        <div class="form-group">
          <label>Nume</label>
          <input type="text" 
          class="form-control" 
          [(ngModel)]="product.name"
          (change)="onNameChange()" 
           name="name" 
           required
           placeholder="Introdu Nume și apasă Enter pentru autocompletare">
        </div>

        <div class="form-group">
          <label>Descriere</label>
          <textarea class="form-control" [(ngModel)]="product.description" name="description"></textarea>
        </div>

        <div class="form-group">
          <label>Preț</label>
          <input type="number" class="form-control" [(ngModel)]="product.unitPrice" name="unitPrice" required>
        </div>

        <div class="form-group">
          <label>URL Imagine</label>
          <input type="text" class="form-control" [(ngModel)]="product.imageUrl" name="imageUrl">
        </div>

        <div class="form-group">
          <label>Unități în stoc</label>
          <input type="number" class="form-control" [(ngModel)]="product.unitsInStock" name="unitsInStock">
        </div>

        <div class="form-group">
            <label>Categorie</label>
            <select class="form-control" [(ngModel)]="product.category" name="category" required>
                <option *ngFor="let tempCategory of categories" [ngValue]="tempCategory">
                    {{ tempCategory.categoryName }}
                </option>
            </select>
        </div>

        <div class="form-check">
          <input type="checkbox" class="form-check-input" [(ngModel)]="product.active" name="active">
          <label class="form-check-label">Activ</label>
        </div>

        <div class="mt-3">
            <button type="submit" class="btn btn-primary me-2">Salvează</button>
            
            <button type="button" 
                    class="btn btn-danger" 
                    (click)="onDelete()" 
                    *ngIf="isEditMode">
                Șterge Produs
            </button>
            
            <a routerLink="/products" class="btn btn-link">Înapoi la listă</a>
        </div>

      </form>
    </div>
  </div>
</div>
