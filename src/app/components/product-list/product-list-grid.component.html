<!-- Promotional Banner -->
<app-promo-banner></app-promo-banner>

<!-- Product Filter -->
<app-product-filter (filtersChanged)="onFiltersChanged($event)"></app-product-filter>

<div class="main-content">
    <div class="section-content section-content-p30">
        <div class="container-fluid"> 
            <div class="row"> 
                <div class="col-lg-3 col-md-6 col-sm-6 col-12 mb-4" *ngFor="let tempProduct of products">

                    <div class="product-box">
                        <div routerLink="/products/{{tempProduct.id}}">
                            <img src="{{ tempProduct.imageUrl }}" 
                                 alt="{{ tempProduct.name }} - Buy online at best price" 
                                 title="{{ tempProduct.name }}"
                                 class="img-responsive img-fluid"
                                 loading="lazy">
                        </div>

                        <a routerLink="/products/{{tempProduct.id}}">
                            <h1> {{ tempProduct.name }}</h1>
                        </a>

                        <div class="price">{{ tempProduct.unitPrice | number:'1.2-2' }} Lei</div>
                        
                        <!-- Product Actions -->
                        <div class="product-actions mb-2">
                            <button (click)="addToCart(tempProduct)" class="btn btn-primary btn-sm me-2">
                                <i class="fas fa-shopping-cart"></i> {{ 'products.add-to-cart' | translate }}
                            </button>
                            <button (click)="wishlistService.isInWishlist(tempProduct.id) ? wishlistService.removeFromWishlist(tempProduct.id) : wishlistService.addToWishlist(tempProduct)" 
                                    class="btn btn-sm"
                                    [ngClass]="wishlistService.isInWishlist(tempProduct.id) ? 'btn-danger' : 'btn-outline-purple'"
                                    [title]="wishlistService.isInWishlist(tempProduct.id) ? ('products.remove-from-favorites' | translate) : ('products.add-to-favorites' | translate)">
                                <i class="fas fa-heart"></i>
                                {{ wishlistService.isInWishlist(tempProduct.id) ? ('products.delete' | translate) : ('products.save' | translate) }}
                            </button>
                        </div>
                        
                        <!-- Admin Actions -->
                        <div *ngIf="isAdmin" class="admin-actions mt-2">
                            <a [routerLink]="['/admin/product-form', tempProduct.id]" 
                               class="btn btn-warning btn-sm me-1"
                               [title]="'common.edit' | translate">
                                <i class="fas fa-edit"></i> {{ 'common.edit' | translate }}
                            </a>
                            <button (click)="deleteProduct(tempProduct)" 
                                    class="btn btn-danger btn-sm"
                                    title="Șterge produsul">
                                <i class="fas fa-trash-alt"></i> Șterge
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div *ngIf="products.length == 0" class="alert alert-warning col-md-12" role="alert">
                Niciun produs găsit.
            </div>
            <hr>
            <!-- begin footer -->
            <div class="footer">
            
                <div class="row">
                    <div class="col-md-6"></div>

                    <div class="col-md-6">
                        <div class="row">
                            <div class="col-md-9" style="padding-right: 80%;">
<!-- begin footer -->
                                <ngb-pagination [(page)]="thePageNumber" 
                                                [pageSize]="thePageSize"
                                                [collectionSize]="theTotalElements" 
                                                [maxSize]="5"
                                                (pageChange)="listProducts()">

                                </ngb-pagination>
<!--begin footer -->


                            </div>
                            <div class="col-md-3 mt-2" style="text-align: left;">
                                <span class="mr-2">Dimensiune Pagină</span>

                                <select #myPageSelect (change)="updatePageSize(myPageSelect.value)">
                                    <option selected="true">8</option>
                                    <option>16</option>
                                    <option>24</option>
                                    <option>32</option>
                                </select>

                            </div>
                        </div>
                    </div>

                </div>
            </div>

            <!-- end footer  -->
        </div>
    </div>
</div>
